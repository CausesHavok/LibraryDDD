name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LibraryDDD.sln

      - name: Build
        run: dotnet build LibraryDDD.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test LibraryDDD.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/Coverage

      - name: Generate coverage report
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator \
            "-reports:TestResults/Coverage/**/coverage.cobertura.xml" \
            "-targetdir:coverage-report" \
            "-reporttypes:Html;MarkdownSummaryGithub"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag librarydd:ci .

      - name: Start container
        run: docker run --detach --name librarydd --publish 8080:8080 librarydd:ci

      - name: Wait for the API
        run: |
          for i in $(seq 1 30); do
            if curl --silent --output /dev/null http://localhost:8080/; then
              exit 0
            fi
            sleep 1
          done
          echo "The API did not start in time."
          exit 1

      - name: Smoke test - register a member
        run: |
          status=$(curl --silent --output response.json --write-out "%{http_code}" \
            --header "Content-Type: application/json" \
            --data '{"name":"Ada Lovelace","email":"ada@example.com","dateOfBirth":"1990-05-17","membershipType":"Adult"}' \
            http://localhost:8080/members/register)
          cat response.json
          echo
          test "$status" = "200"
          grep -qi memberId response.json

      - name: Smoke test - reject an invalid date
        run: |
          status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --header "Content-Type: application/json" \
            --data '{"name":"Ada Lovelace","email":"ada@example.com","dateOfBirth":"17/05/1990","membershipType":"Adult"}' \
            http://localhost:8080/members/register)
          echo "HTTP $status"
          test "$status" = "400"

      - name: Container logs
        if: failure()
        run: docker logs librarydd

      - name: Stop container
        if: always()
        run: docker rm --force librarydd

  publish-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: coverage-report
      - id: deployment
        uses: actions/deploy-pages@v4